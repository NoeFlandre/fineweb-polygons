site_name: FineWeb Polygons
site_description: Reproducible foundations for FineWeb documents tied to OpenStreetMap polygons.
site_url: https://noeflandre.github.io/fineweb-polygons/
repo_name: NoeFlandre/fineweb-polygons
repo_url: https://github.com/NoeFlandre/fineweb-polygons
edit_uri: edit/main/docs/
site_dir: /Volumes/Seagate M3/projects/fineweb-polygons/site
exclude_docs: |
  superpowers/*

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Overview: index.md
  - Direction registry: directions/README.md
  - "Direction 1: FineWeb retrieval":
      - Overview: directions/fineweb-retrieval/README.md
      - Version contracts: directions/fineweb-retrieval/versions.md
  - "Direction 2: lexical candidates":
      - Overview: directions/lexical-candidates/README.md
      - "V1: broad lexical baseline": directions/lexical-candidates/v1/README.md
      - "V2: specificity-aware": directions/lexical-candidates/v2/README.md
  - "Direction 3: text to geographic footprint":
      - Overview: directions/text-geographic-footprint/README.md
  - Dataset catalog: dataset-catalog.md
  - Architecture:
      - Foundation: architecture/foundation.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
