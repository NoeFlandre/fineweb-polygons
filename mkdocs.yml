site_name: FineWeb Polygons
site_description: Reproducible foundations for FineWeb documents tied to OpenStreetMap polygons.
site_url: https://noeflandre.github.io/fineweb-polygons/
repo_name: NoeFlandre/fineweb-polygons
repo_url: https://github.com/NoeFlandre/fineweb-polygons
edit_uri: edit/main/docs/
site_dir: /Volumes/Seagate M3/projects/fineweb-polygons/site
exclude_docs: |
  superpowers/*

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Overview: index.md
  - Directions:
      - Registry: directions/README.md
      - "Direction 1: FineWeb retrieval": directions/fineweb-retrieval/README.md
      - "Direction 2: lexical candidates": directions/lexical-candidates/README.md
  - Versions: versions.md
  - Dataset catalog: dataset-catalog.md
  - Architecture:
      - Foundation: architecture/foundation.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
