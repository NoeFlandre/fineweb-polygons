name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:.

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      COVERAGE_JSON: ${{ github.workspace }}/coverage.json
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.16
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests scripts
      - run: uv run python scripts/build_catalog.py --check
      - run: uv run pytest
      - run: uv run pytest --no-cov -m property
      - run: uv run pytest --no-cov -m acceptance
      - run: uv run pytest --no-cov -m architecture
      - run: uv run python scripts/check_crap.py --source src --coverage coverage.json --max-crap 6
      - run: uv build --out-dir "${{ github.workspace }}/dist"
      - run: uv run mkdocs build --strict --site-dir "${{ github.workspace }}/site"
      - run: uv run fineweb-polygons
      - run: docker build --tag fineweb-polygons:ci .
      - run: docker run --rm fineweb-polygons:ci

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.16
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run mutmut run --max-children 1
      - run: uv run python scripts/check_mutation.py
